        <button onclick="encrypt()">🔒 加密</button>
        <button onclick="decrypt()">🔓 解密</button>
        <button onclick="copyOutput()">📋复制结果</button>
    </div>
    <div class="tip" id="msg"></div>
    <textarea id="result" placeholder="输出结果在这里" readonly></textarea>
</div>

<script>
const msgBox = document.getElementById("msg");
function showMsg(text){
    msgBox.innerText = text;
}

// 加密
function encrypt(){
    showMsg("");
    const text = document.getElementById("content").value;
    const key = document.getElementById("secretKey").value.trim();
    if(!key){
        showMsg("⚠️请填写密钥！");
        return;
    }
    try{
        // 使用OpenSSL兼容格式输出
        const encrypted = CryptoJS.AES.encrypt(text, key).toString();
        document.getElementById("result").value = encrypted;
        showMsg("✅加密完成，把【密文】+【密钥】发给对方");
    }catch(err){
        showMsg("❌加密异常："+err.message);
    }
}

// 解密
function decrypt(){
    showMsg("");
    const cipherText = document.getElementById("content").value.trim();
    const key = document.getElementById("secretKey").value.trim();
    if(!key){
        showMsg("⚠️请填写密钥！");
        return;
    }
    try{
        const bytes = CryptoJS.AES.decrypt(cipherText, key);
        const plain = bytes.toString(CryptoJS.enc.Utf8);
        if(!plain){
            showMsg("❌解密失败！密钥错误 / 密文损坏");
            document.getElementById("result").value = "";
            return;
        }
        document.getElementById("result").value = plain;
        showMsg("✅解密成功");
    }catch(err){
        showMsg("❌解密失败！密钥错误 / 密文损坏");
        document.getElementById("result").value = "";
    }
}

// 复制输出框内容
async function copyOutput(){
    const out = document.getElementById("result").value;
    if(!out) return;
    try{
        await navigator.clipboard.writeText(out);
        showMsg("✅已复制到剪贴板");
    }catch(e){
        showMsg("复制失败，请手动选中复制");
    }
}
</script>
</body>
</html>
