<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>嘎家专用加密网页 · 网址加密/解密</title>
<style>
  :root{
    --bg1:#0b1220; --bg2:#131c33; --card:rgba(255,255,255,.06);
    --line:rgba(255,255,255,.12); --txt:#e8edf7; --sub:#9fb0cc;
    --brand:#7c9cff; --brand2:#37e6c8; --ok:#2ecc71; --warn:#f6b93b; --danger:#ff6b81;
    --shadow:0 18px 45px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--txt); min-height:100vh;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(124,156,255,.25), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(55,230,200,.18), transparent 55%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    background-attachment:fixed;
    padding:env(safe-area-inset-top) 0 calc(20px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;padding:22px 16px 60px;}

  /* 顶部品牌 */
  header{text-align:center;margin:10px 0 18px;}
  .logo{
    width:58px;height:58px;margin:0 auto 12px;border-radius:18px;
    display:grid;place-items:center;font-size:26px;font-weight:800;
    background:linear-gradient(135deg,var(--brand),var(--brand2));
    color:#0b1220;box-shadow:var(--shadow);
    letter-spacing:-1px;
  }
  header h1{font-size:21px;margin:0 0 4px;letter-spacing:.5px;}
  header p{font-size:12.5px;color:var(--sub);margin:0;line-height:1.6;}

  /* 卡片 */
  .card{
    background:var(--card);border:1px solid var(--line);
    border-radius:20px;padding:18px;margin-bottom:16px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:var(--shadow);
  }

  /* Tabs */
  .tabs{display:flex;background:rgba(0,0,0,.25);border-radius:14px;padding:4px;margin-bottom:16px;}
  .tabs button{
    flex:1;border:none;background:transparent;color:var(--sub);
    padding:11px 0;font-size:14.5px;font-weight:600;border-radius:11px;transition:.25s;
  }
  .tabs button.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#0b1220;box-shadow:0 6px 16px rgba(124,156,255,.4);}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:7px;font-weight:600;letter-spacing:.3px;}
  textarea, input[type=password], input[type=text]{
    width:100%;border:1px solid var(--line);border-radius:14px;
    background:rgba(0,0,0,.28);color:var(--txt);font-size:14.5px;
    padding:13px 14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    line-height:1.5;outline:none;transition:.2s;
  }
  textarea{min-height:110px;resize:vertical;}
  textarea:focus, input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(124,156,255,.18);}
  textarea::placeholder, input::placeholder{color:rgba(159,176,204,.55);}

  /* 密钥行 */
  .pwd{position:relative;}
  .pwd input{padding-right:52px;}
  .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--sub);font-size:18px;padding:8px;}

  /* 强度条 */
  .strength{height:5px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:9px;overflow:hidden;}
  .strength i{display:block;height:100%;width:0;transition:.3s;border-radius:4px;}
  .strength span{font-size:11.5px;color:var(--sub);margin-top:5px;display:block;}

  /* 主按钮 */
  .btn{
    width:100%;border:none;border-radius:15px;padding:15px;font-size:16px;font-weight:700;
    color:#0b1220;background:linear-gradient(135deg,var(--brand),var(--brand2));
    box-shadow:0 10px 24px rgba(55,230,200,.3);transition:.2s;letter-spacing:.5px;
  }
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:rgba(255,255,255,.08);color:var(--txt);box-shadow:none;border:1px solid var(--line);}

  .row2{display:flex;gap:10px;margin-top:12px;}
  .row2 .btn{font-size:14.5px;padding:13px;}

  /* 提示框 */
  .tip{font-size:12px;color:var(--sub);line-height:1.7;background:rgba(124,156,255,.08);border:1px solid rgba(124,156,255,.25);border-radius:12px;padding:12px 14px;margin-top:14px;}
  .tip b{color:var(--brand);}

  /* 结果区 */
  .result{position:relative;}
  .result .tag{position:absolute;top:-10px;right:14px;font-size:10.5px;background:var(--brand);color:#0b1220;font-weight:700;padding:2px 9px;border-radius:8px;}

  /* Toast */
  #toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    background:rgba(15,23,42,.96);border:1px solid var(--line);color:#fff;
    padding:11px 20px;border-radius:30px;font-size:13.5px;z-index:99;
    opacity:0;pointer-events:none;transition:.3s;box-shadow:var(--shadow);
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast.err{border-color:var(--danger);color:#ffd7de;}
  #toast.ok{border-color:var(--ok);color:#d8ffe7;}

  .foot{text-align:center;font-size:11px;color:rgba(159,176,204,.6);margin-top:22px;line-height:1.7;}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">嘎</div>
    <h1>嘎家专用加密网页</h1>
    <p>纯本地运行 · 加密 / 解密 网址 · 双方约定同一把密钥即可</p>
  </header>

  <div class="card">
    <div class="tabs" role="tablist">
      <button id="tabEnc" class="on" onclick="switchTab('enc')">🔒 加密网址</button>
      <button id="tabDec" onclick="switchTab('dec')">🔓 解密网址</button>
    </div>

    <!-- 加密面板 -->
    <div id="panelEnc">
      <div class="field">
        <label>要加密的网址</label>
        <textarea id="plain" placeholder="https://example.com/s/abc123?ref=gajia"></textarea>
      </div>
      <div class="field">
        <label>密钥（双方约定好，务必一致）</label>
        <div class="pwd">
          <input type="password" id="keyEnc" placeholder="建议 12 位以上，含大小写+数字+符号">
          <button class="eye" onclick="toggleEye('keyEnc')">👁️</button>
        </div>
        <div class="strength"><i id="bar"></i><span id="barTxt">密钥强度：尚未输入</span></div>
      </div>
      <button class="btn" onclick="doEncrypt()">加 密</button>
      <div class="row2">
        <button class="btn ghost" onclick="fillSample()">填入示例网址</button>
        <button class="btn ghost" onclick="clearAll()">清空</button>
      </div>
    </div>

    <!-- 解密面板 -->
    <div id="panelDec" class="hidden">
      <div class="field">
        <label>收到的密文（整段粘贴）</label>
        <textarea id="cipher" placeholder="v1$...一长串密文..."></textarea>
      </div>
      <div class="field">
        <label>密钥（必须与加密方完全相同）</label>
        <div class="pwd">
          <input type="password" id="keyDec" placeholder="输入约定密钥">
          <button class="eye" onclick="toggleEye('keyDec')">👁️</button>
        </div>
      </div>
      <button class="btn" onclick="doDecrypt()">解 密</button>
      <div class="row2">
        <button class="btn ghost" onclick="pasteCipher()">从剪贴板粘贴</button>
        <button class="btn ghost" onclick="clearAll()">清空</button>
      </div>
    </div>
  </div>

  <!-- 结果卡片 -->
  <div class="card result hidden" id="resultCard">
    <span class="tag" id="resultTag">结果</span>
    <div class="field" style="margin-bottom:0">
      <label id="resultLabel">加密结果</label>
      <textarea id="result" readonly placeholder="结果将显示在这里"></textarea>
    </div>
    <button class="btn" style="margin-top:14px" onclick="copyResult()">⧉ 复制结果</button>
    <button class="btn ghost" id="openLinkBtn" style="margin-top:10px;display:none" onclick="openLink()">🔗 打开此网址</button>
  </div>

  <div class="tip">
    <b>使用方式：</b><br>
    ① 发送方：填入网址 + 双方约定密钥 → 加密 → 把<b>整段密文</b>发给对方<br>
    ② 接收方：粘贴密文 + <b>同一把密钥</b> → 解密 → 得到原始网址<br>
    <b>说明：</b>全程在你的浏览器本地完成，不上传任何数据。密钥仅双方持有，请自行安全传递（见面/电话/加密聊天）。
  </div>

  <div class="foot">
    · 嘎家专用 · 纯静态单文件 · 无需后端 ·<br>
    算法：AES-256-GCM · PBKDF2-SHA256（10万次迭代）
  </div>
</div>

<div id="toast"></div>

<script>
/* ============ 核心加密逻辑 ============ */
const ENC = { name: "AES-GCM", length: 256 };
const ITER  = 100000;      // PBKDF2 迭代次数
const SALT  = 16;          // 随机盐字节数
const IV    = 12;          // GCM 推荐 IV 长度
const TAG   = 16;          // GCM 认证标签长度
const VERSION = "v1";

// 密钥派生：口令 -> AES-256 密钥
async function deriveKey(passphrase, salt) {
  const baseKey = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(passphrase),
    "PBKDF2", false, ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" },
    baseKey, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
  );
}

// 加密：明文 -> Base64(v1$salt$iv$ciphertext)
async function encrypt(plaintext, passphrase) {
  const salt = crypto.getRandomValues(new Uint8Array(SALT));
  const iv   = crypto.getRandomValues(new Uint8Array(IV));
  const key  = await deriveKey(passphrase, salt.buffer);
  const ct   = await crypto.subtle.encrypt(
    { name: "AES-GCM", iv: iv.buffer },
    key, new TextEncoder().encode(plaintext)
  );
  // 组装：salt + iv + ciphertext(含tag)
  const combined = new Uint8Array(SALT + IV + ct.byteLength);
  combined.set(salt, 0);
  combined.set(iv, SALT);
  combined.set(new Uint8Array(ct), SALT + IV);
  return VERSION + "$" + b64encode(combined);
}

// 解密：密文 -> 明文（校验版本与格式）
async function decrypt(payload, passphrase) {
  const parts = payload.trim().split("$");
  if (parts.length !== 2 || parts[0] !== VERSION) {
    throw new Error("密文格式无效，请检查是否复制完整（应以 v1$ 开头）");
  }
  const combined = b64decode(parts[1]);
  if (combined.byteLength < SALT + IV + TAG) {
    throw new Error("密文长度异常，可能已损坏或不完整");
  }
  const salt = combined.slice(0, SALT);
  const iv   = combined.slice(SALT, SALT + IV);
  const ct   = combined.slice(SALT + IV);
  const key  = await deriveKey(passphrase, salt);
  try {
    const pt = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: iv }, key, ct
    );
    return new TextDecoder().decode(pt);
  } catch (e) {
    throw new Error("解密失败：密钥错误或密文已被篡改");
  }
}

/* ============ Base64（URL安全） ============ */
function b64encode(bytes){
  let s = "";
  for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64decode(str){
  let s = str.replace(/-/g,"+").replace(/_/g,"/");
  while (s.length % 4) s += "=";
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}

/* ============ 界面交互 ============ */
function switchTab(mode){
  document.getElementById("tabEnc").classList.toggle("on", mode==="enc");
  document.getElementById("tabDec").classList.toggle("on", mode==="dec");
  document.getElementById("panelEnc").classList.toggle("hidden", mode!=="enc");
  document.getElementById("panelDec").classList.toggle("hidden", mode!=="dec");
  hideResult();
}

function toggleEye(id){
  const el = document.getElementById(id);
  el.type = el.type === "password" ? "text" : "password";
}

// 密钥强度实时评估
const keyInput = document.getElementById("keyEnc");
keyInput.addEventListener("input", checkStrength);
function checkStrength(){
  const v = keyInput.value;
  const bar = document.getElementById("bar");
  const txt = document.getElementById("barTxt");
  let score = 0;
  if (v.length >= 8)  score++;
  if (v.length >= 12) score++;
  if (/[a-z]/.test(v) && /[A-Z]/.test(v)) score++;
  if (/\d/.test(v)) score++;
  if (/[^A-Za-z0-9]/.test(v)) score++;
  const map = [
    {w:0,  c:"transparent", t:"密钥强度：尚未输入"},
    {w:20, c:"#ff6b81",     t:"很弱 · 至少 8 位"},
    {w:40, c:"#f6b93b",     t:"一般 · 建议更长更杂"},
    {w:65, c:"#f6b93b",     t:"中等"},
    {w:85, c:"#2ecc71",     t:"较强"},
    {w:100,c:"#2ecc71",     t:"很强 · 可以放心用"},
  ];
  const s = map[Math.min(score,5)];
  bar.style.width = v.length ? s.w + "%" : "0%";
  bar.style.background = s.c;
  txt.textContent = s.t;
}

async function doEncrypt(){
  const plain = document.getElementById("plain").value.trim();
  const key   = document.getElementById("keyEnc").value;
  if (!plain) return toast("请先输入要加密的网址","err");
  if (!isValidUrl(plain)) return toast("请输入完整网址（含 http/https）","err");
  if (key.length < 4) return toast("密钥至少 4 位，建议 12 位以上","err");
  try {
    const ct = await encrypt(plain, key);
    showResult("加密结果（密文）", ct, "cipher");
    toast("加密成功 ✔","ok");
  } catch(e){ toast(e.message,"err"); }
}

async function doDecrypt(){
  const cipher = document.getElementById("cipher").value.trim();
  const key    = document.getElementById("keyDec").value;
  if (!cipher) return toast("请粘贴密文","err");
  if (!key)    return toast("请输入密钥","err");
  try {
    const pt = await decrypt(cipher, key);
    showResult("解密结果（原始网址）", pt, "link");
    toast("解密成功 ✔","ok");
  } catch(e){ toast(e.message,"err"); }
}

function showResult(label, text, kind){
  const card = document.getElementById("resultCard");
  document.getElementById("resultLabel").textContent = label;
  document.getElementById("result").value = text;
  document.getElementById("resultTag").textContent = kind==="link" ? "网址" : "密文";
  document.getElementById("openLinkBtn").style.display = kind==="link" ? "block" : "none";
  card.classList.remove("hidden");
  card.scrollIntoView({behavior:"smooth", block:"nearest"});
}
function hideResult(){
  document.getElementById("resultCard").classList.add("hidden");
}

function copyResult(){
  const v = document.getElementById("result").value;
  if (!v) return;
  navigator.clipboard.writeText(v).then(
    () => toast("已复制到剪贴板 ✔","ok"),
    () => { // 降级
      const ta = document.getElementById("result");
      ta.select(); document.execCommand("copy"); toast("已复制 ✔","ok");
    }
  );
}

function openLink(){
  const v = document.getElementById("result").value.trim();
  if (isValidUrl(v)) window.open(v, "_blank", "noopener");
  else toast("解密结果不是有效网址","err");
}

function isValidUrl(s){
  try { new URL(s); return /^https?:\/\//i.test(s); } catch { return false; }
}

function fillSample(){
  document.getElementById("plain").value = "https://www.example.com/login?token=gajia-2026";
  hideResult();
}

async function pasteCipher(){
  try {
    const t = await navigator.clipboard.readText();
    document.getElementById("cipher").value = t;
    toast("已从剪贴板粘贴","ok");
  } catch { toast("无法读取剪贴板，请手动粘贴","err"); }
}

function clearAll(){
  ["plain","cipher","result"].forEach(id => document.getElementById(id).value = "");
  hideResult();
}

/* ============ Toast ============ */
let toastTimer;
function toast(msg, type){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = (type||"") + " show";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.className = "", 2400);
}

// 初始化
checkStrength();
</script>
</body>
</html>
